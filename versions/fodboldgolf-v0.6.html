<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fodboldgolf</title>
<style>
  html,body{margin:0;height:100%;background:#2c5f20;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .card{background:rgba(16,40,14,.72);border-radius:12px;padding:7px 11px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #info b{font-size:15px;letter-spacing:.3px}
  #info small{opacity:.7;font-size:11px;margin-left:4px}
  #info div{font-size:12.5px;opacity:.92;margin-top:2px}
  #score{text-align:right}
  #score .n{font-size:24px;font-weight:800;line-height:1}
  #score .l{font-size:11px;opacity:.85}
  #btns{position:fixed;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px}
  button{font:inherit;border:0;border-radius:12px;background:rgba(16,40,14,.78);color:#fff;padding:10px 13px;font-size:13px;font-weight:600}
  button:active{background:rgba(60,110,40,.9)}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(66vw,300px);background:rgba(0,0,0,.6);color:#fff;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.35;text-align:center;pointer-events:none;transition:opacity .4s}
  #end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,30,8,.55)}
  #end .box{background:#fbfaf2;color:#1d3a14;border-radius:20px;padding:24px 28px;text-align:center;min-width:220px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #end h2{margin:0 0 4px;font-size:28px}
  #end p{margin:4px 0 16px;font-size:15px;opacity:.8}
  #end button{background:#2f7d22;font-size:16px;padding:12px 22px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="card" id="info"><b>Fodboldgolf</b><small id="ver"></small><div id="sub"></div></div>
  <div class="card" id="score"><div class="n" id="strokes">0</div><div class="l">slag · par 4</div></div>
</div>
<div id="btns">
  <button id="bSnd">🔊</button>
  <button id="bMap">Kort</button>
  <button id="bRe">Forfra</button>
</div>
<div id="toast"></div>
<div id="hint">Træk tilbage for at sparke.<br>Kort træk = langs jorden · langt = i luften<br>Bøj trækket til siden = skru</div>
<div id="end"><div class="box"><h2 id="eT"></h2><p id="eP"></p><button id="eB">Spil igen</button></div></div>
<script>
'use strict';
const VERSION='0.6';
//<PHYS>
const W=600,H=1800,G=900,BR=7;
const HOLE={x:400,y:170,r:13}, TEE={x:300,y:1700};
const FW=[[300,1700],[300,1250],[170,900],[170,700],[400,420],[400,200]], FWW=78;
const GREEN={x:400,y:190,r:78};
const WATER=[{x:420,y:1060,rx:90,ry:62}];
const BUNK=[{x:268,y:300,rx:36,ry:27},{x:536,y:300,rx:38,ry:28}];
const MOUNDS=[{x:185,y:830,s:42,a:1},{x:325,y:240,s:30,a:.5}];
const SEGS=[
  {x1:222,y1:1480,x2:378,y2:1480,th:14,h:9,z0:0,type:'log'},
  {x1:300,y1:300,x2:380,y2:300,th:8,h:32,z0:0,type:'hedge'},
  {x1:420,y1:300,x2:500,y2:300,th:8,h:32,z0:0,type:'hedge'},
  {x1:380,y1:300,x2:420,y2:300,th:8,h:32,z0:24,type:'top'}
];
const TREES=[[285,715],[325,690],[300,760],[255,770],
  [60,1500],[540,1560],[70,1150],[545,800],[60,500],[110,330],[540,470],[80,120],[545,110],[530,1300],[50,1700]]
  .map((p,i)=>({x:p[0],y:p[1],r:26+(i*7%9),i}));
const FRIC={fairway:[60,.5],green:[45,.4],rough:[150,1.1],bunker:[520,3],water:[60,.5]};
const SLOPE_K=8000, MAXV=760, LOFT_T=0.45;

function inEll(e,x,y){const a=(x-e.x)/e.rx,b=(y-e.y)/e.ry;return a*a+b*b<1}
function distFW(x,y){let m=1e9;for(let i=0;i<FW.length-1;i++){const a=FW[i],b=FW[i+1];const dx=b[0]-a[0],dy=b[1]-a[1];
  let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;const d=Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t);if(d<m)m=d}return m}
function surfAt(x,y){
  for(const w of WATER)if(inEll(w,x,y))return'water';
  for(const b of BUNK)if(inEll(b,x,y))return'bunker';
  if(Math.hypot(x-GREEN.x,y-GREEN.y)<GREEN.r)return'green';
  if(distFW(x,y)<FWW)return'fairway';
  return'rough';
}
function grad(x,y){let gx=0,gy=0;for(const m of MOUNDS){const dx=x-m.x,dy=y-m.y,s2=m.s*m.s;const e=m.a*Math.exp(-(dx*dx+dy*dy)/(2*s2));gx+=-dx/s2*e;gy+=-dy/s2*e}return[gx,gy]}
function kickParams(t,spin,ang){
  let sp=Math.pow(t,1.15)*MAXV,vz=0;
  if(t>LOFT_T){
    // jo længere træk, jo stejlere og kraftigere: giver korte høje lobs tæt på forhindringer
    const u=(t-LOFT_T)/(1-LOFT_T),el=(12+32*(1-Math.pow(1-u,3)))*Math.PI/180;
    sp*=1+.18*u;vz=sp*Math.sin(el);sp*=Math.cos(el);
  }
  return{vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,vz,spin};
}
function settle(b){
  // en bold der ligger helt op ad en forhindring flyttes lidt væk, så man har plads til at løfte over
  for(const s of SEGS){
    const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
    const px=s.x1+dx*t,py=s.y1+dy*t;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),R=s.th/2+BR+50;
    if(d<R){if(d<.01){nx=0;ny=1}else{nx/=d;ny/=d}b.x=px+nx*R;b.y=py+ny*R}
  }
}
// Ét fysik-trin. Bruges både til det rigtige spark og til sigtekornet, så de altid passer sammen.
function step(b,dt,ev){
  const air=b.z>0||b.vz>0;
  if(air){
    b.vz-=G*dt;b.z+=b.vz*dt;
    const a=b.spin*1.3*dt,c=Math.cos(a),s=Math.sin(a);const vx=b.vx*c-b.vy*s,vy=b.vx*s+b.vy*c;
    const d=Math.exp(-.25*dt);b.vx=vx*d;b.vy=vy*d;b.spin*=Math.exp(-.3*dt);
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.z<=0){b.z=0;const sf=surfAt(b.x,b.y);
      if(sf==='water'){ev&&ev.push('water');b.done='water';return}
      if(sf==='bunker'){b.vz=0;b.vx*=.2;b.vy*=.2;b.spin=0;ev&&ev.push('sand')}
      else{const hs=Math.hypot(b.vx,b.vy),sn=Math.abs(b.vz)/Math.hypot(b.vz,hs||1);
        const up=-b.vz*(sf==='rough'?.22:.3);const k=(sf==='rough'?.6:.82)*(1-.3*sn);b.vx*=k;b.vy*=k;
        if(up>60){b.vz=up;ev&&ev.push('bounce')}else{b.vz=0;ev&&ev.push('land')}}
    }
  }else{
    b.vz=0;b.z=0;const sf=surfAt(b.x,b.y);
    if(sf==='water'){ev&&ev.push('water');b.done='water';return}
    let sp=Math.hypot(b.vx,b.vy);
    if(sp>1){const a=b.spin*.55*dt,c=Math.cos(a),s=Math.sin(a);const vx=b.vx*c-b.vy*s,vy=b.vx*s+b.vy*c;b.vx=vx;b.vy=vy}
    b.spin*=Math.exp(-1.3*dt);
    const g=grad(b.x,b.y),ax=-g[0]*SLOPE_K,ay=-g[1]*SLOPE_K,sa=Math.hypot(ax,ay);
    const f=FRIC[sf];
    // lille træk ned i hullet når bolden er helt tæt på og langsom
    const hd=Math.hypot(b.x-HOLE.x,b.y-HOLE.y);
    if(hd<HOLE.r+4&&sp<70){b.vx+=(HOLE.x-b.x)/hd*260*dt;b.vy+=(HOLE.y-b.y)/hd*260*dt}
    if(sp<6&&sa<f[0]&&!(hd<HOLE.r+4)){b.vx=b.vy=0;b.done='stop';return}
    b.vx+=ax*dt;b.vy+=ay*dt;sp=Math.hypot(b.vx,b.vy);
    if(sp>0){const ns=Math.max(0,sp-(f[0]+f[1]*sp)*dt);b.vx*=ns/sp;b.vy*=ns/sp}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(hd<HOLE.r+4&&sp<4&&hd>HOLE.r-2){b.vx=b.vy=0;b.done='stop';return}
  }
  // forhindringer
  for(const s of SEGS){
    if(b.z>=s.h||b.z+BR<s.z0)continue;
    const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
    const cx=s.x1+dx*t,cy=s.y1+dy*t;let nx=b.x-cx,ny=b.y-cy;const d=Math.hypot(nx,ny),R=s.th/2+BR;
    if(d<R&&d>0){nx/=d;ny/=d;b.x=cx+nx*R;b.y=cy+ny*R;const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.45*vn*nx;b.vy-=1.45*vn*ny;b.vx*=.85;b.vy*=.85;if(vn<-40)ev&&ev.push(s.type==='log'?'wood':'hedge')}}
  }
  for(const t of TREES){
    const dx=b.x-t.x,dy=b.y-t.y,d=Math.hypot(dx,dy);
    if(b.z<95&&d<7+BR&&d>0){const nx=dx/d,ny=dy/d;b.x=t.x+nx*(7+BR);b.y=t.y+ny*(7+BR);const vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny;if(vn<-40)ev&&ev.push('wood')}}
    else if(b.z>30&&b.z<115&&d<t.r&&!b.leaf){b.leaf=1;b.vx*=.22;b.vy*=.22;if(b.vz>0)b.vz=0;b.spin=0;ev&&ev.push('leaf')}
  }
  if(b.z===0)b.leaf=0;
  if(b.x<BR+8){b.x=BR+8;b.vx=Math.abs(b.vx)*.4}if(b.x>W-BR-8){b.x=W-BR-8;b.vx=-Math.abs(b.vx)*.4}
  if(b.y<BR+8){b.y=BR+8;b.vy=Math.abs(b.vy)*.4}if(b.y>H-BR-8){b.y=H-BR-8;b.vy=-Math.abs(b.vy)*.4}
  // hul
  if(b.z<4&&Math.hypot(b.x-HOLE.x,b.y-HOLE.y)<HOLE.r-3){
    const sp=Math.hypot(b.vx,b.vy);
    if(sp<300&&b.vz<=0){b.done='sunk';ev&&ev.push('sunk');return}
    if(b.z===0&&b.vz===0){b.vz=150;b.vx*=.55;b.vy*=.55;ev&&ev.push('lip')}
  }
}
//</PHYS>

// ---------- lyd (fysisk modelleret: dæmpede resonanser + filtreret støj + rumklang) ----------
let AC=null,sndOn=true,master=null,verb=null,rollG=null,rollF=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.9;master.connect(comp);
    verb=AC.createConvolver();const sr=AC.sampleRate,n=sr*1.1|0,ir=AC.createBuffer(2,n,sr);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*(i<sr*.012?i/(sr*.012):1)}
    verb.buffer=ir;const vg=AC.createGain();vg.gain.value=.5;verb.connect(vg);vg.connect(comp);
  }catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
function send(g,wet){g.connect(master);if(wet){const w=AC.createGain();w.gain.value=wet;g.connect(w);w.connect(verb)}}
// støjglimt med eksponentiel udklingning, filtreret
function nb(dur,o){const a=ac();if(!a||!sndOn)return;o=o||{};const sr=a.sampleRate,n=Math.max(16,sr*dur|0),buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0),k=o.decay||4;
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,k);
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||1000;f.Q.value=o.q||.7;
  const g=a.createGain();g.gain.value=o.vol||.3;s.connect(f);f.connect(g);send(g,o.wet);s.start(a.currentTime+(o.delay||0))}
// dæmpet resonans (som en genstand der bliver ramt)
function ring(f,dec,vol,o){const a=ac();if(!a||!sndOn)return;o=o||{};const t=a.currentTime+(o.delay||0),os=a.createOscillator(),g=a.createGain();os.type='sine';
  os.frequency.setValueAtTime(f,t);if(o.drop)os.frequency.exponentialRampToValueAtTime(Math.max(20,f*o.drop),t+dec*.7);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.002);g.gain.exponentialRampToValueAtTime(.0005,t+dec);
  os.connect(g);send(g,o.wet);os.start(t);os.stop(t+dec+.05)}
const rr=(a,b)=>a+Math.random()*(b-a);
const SND={
  kick(p){ // læderbold: dump krop + slag fra skoen + lille luftpust
    const v=.45+.55*p;
    ring(rr(88,104)+30*p,.16,.68*v,{drop:.55,wet:.1});ring(rr(170,200),.08,.22*v,{drop:.7});
    nb(.05,{f:rr(1500,2100),q:.8,vol:.42*v,decay:5,wet:.12});nb(.02,{f:4200,q:.7,vol:.28*v,decay:6});
    nb(.14,{type:'lowpass',f:260,vol:.26*v,decay:3})},
  bounce(s){s=s||.5;ring(rr(78,92),.1,.5*s+.12,{drop:.6,wet:.08});nb(.07,{type:'lowpass',f:rr(380,520),vol:.3*s+.05,decay:3});nb(.04,{f:2200,q:.6,vol:.07*s,decay:5})},
  land(s){s=s||.4;nb(.08,{type:'lowpass',f:330,vol:.16+.2*s,decay:3});ring(66,.06,.12+.15*s,{drop:.7})},
  wood(s){s=Math.max(.3,s||.6);[[210,.15,.5],[470,.1,.34],[780,.08,.24],[1250,.05,.14]].forEach(m=>ring(m[0]*rr(.97,1.03),m[1],m[2]*s,{wet:.12}));
    nb(.015,{type:'highpass',f:3000,vol:.3*s,decay:5});ring(95,.09,.35*s,{drop:.7})},
  hedge(s){s=Math.max(.3,s||.6);for(let i=0;i<7;i++)nb(rr(.04,.11),{f:rr(2800,6200),q:rr(.8,1.6),vol:.32*s,decay:2.5,delay:i*.022+rr(0,.02),wet:.08});nb(.12,{type:'lowpass',f:500,vol:.3*s,decay:3})},
  leaf(){for(let i=0;i<12;i++)nb(rr(.05,.13),{f:rr(1900,5200),q:rr(.7,1.4),vol:.26,decay:2,delay:i*.024+rr(0,.03),wet:.08})},
  sand(){for(let i=0;i<16;i++)nb(rr(.02,.05),{f:rr(1400,4200),q:.9,vol:.3,decay:3,delay:i*.016+rr(0,.015)});nb(.2,{type:'lowpass',f:700,vol:.32,decay:2})},
  lip(){ring(1450,.06,.26,{wet:.15});ring(2350,.045,.16,{wet:.15});nb(.012,{type:'highpass',f:3500,vol:.15,decay:5})},
  water(){nb(.55,{f:850,q:.45,vol:.6,decay:2.2,wet:.15});nb(.28,{type:'highpass',f:2600,vol:.28,decay:3});nb(.12,{type:'lowpass',f:180,vol:.5,decay:2});
    for(let i=0;i<8;i++){const f=rr(420,1100);ring(f,rr(.05,.1),rr(.08,.15),{drop:1.7,delay:.07+i*rr(.045,.07),wet:.1})}},
  sunk(){ // bold i plastikkop: rasler, klikker og lander dumpt
    let t=0,v=.9;for(let i=0;i<5;i++){const f=rr(.93,1.07);ring(1050*f,.06,.3*v,{delay:t,wet:.15});ring(2000*f,.04,.18*v,{delay:t,wet:.15});ring(3250*f,.03,.1*v,{delay:t});nb(.012,{type:'highpass',f:3500,vol:.18*v,decay:5,delay:t});t+=.11*Math.pow(.72,i);v*=.7}
    ring(125,.12,.42,{drop:.6,delay:t+.04,wet:.12});nb(.06,{type:'lowpass',f:520,vol:.3,decay:3,delay:t+.04})},
  result(d,hio){
    if(hio){applause(1,4.2,75);roar(.5,3.4)}
    else if(d<=-1){applause(.85,3.2,62);roar(.28,2.4)}
    else if(d===0){applause(.6,2.2,42)}
    else if(d===1){applause(.3,1.6,22)}
    else{applause(.12,1.1,9)}
  }
};
// klapsalve: mange enkelte klap (korte filtrerede støjglimt) med tilfældig placering, stereo og rumklang
function applause(vol,dur,dens){
  const a=ac();if(!a||!sndOn)return;const sr=a.sampleRate,n=sr*dur|0,buf=a.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c),claps=Math.floor(dur*dens);
    for(let k=0;k<claps;k++){let t=0;for(let tr=0;tr<6;tr++){t=Math.random()*dur;const x=t/dur;if(Math.random()<Math.min(1,t/.4)*(1-.92*Math.pow(x,2.5)))break}
      const i0=t*sr|0,len=sr*rr(.02,.045)|0,amp=.3*vol*(.25+.75*Math.random()),tau=sr*rr(.004,.009);
      for(let j=0;j<len&&i0+j<n;j++)d[i0+j]+=(Math.random()*2-1)*amp*Math.exp(-j/tau)}}
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2100;f.Q.value=.42;
  const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=600;const g=a.createGain();g.gain.value=1;s.connect(f);f.connect(hp);hp.connect(g);g.gain.value=1.6;send(g,.4);s.start();
  // mumlen fra publikum
  const m=a.createBuffer(1,n,sr),md=m.getChannelData(0);let b=0;for(let i=0;i<n;i++){b=(b+.04*(Math.random()*2-1))/1.04;const x=i/n;md[i]=b*5*Math.min(1,i/(sr*.3))*Math.pow(1-x,1.5)}
  const ms=a.createBufferSource();ms.buffer=m;const mf=a.createBiquadFilter();mf.type='bandpass';mf.frequency.value=650;mf.Q.value=.8;const mg=a.createGain();mg.gain.value=.5*vol;ms.connect(mf);mf.connect(mg);send(mg,.3);ms.start();
}
// jublen: bredbåndet "aaah" fra mange stemmer, formantfiltreret støj der svulmer op
function roar(vol,dur){
  const a=ac();if(!a||!sndOn)return;const sr=a.sampleRate,n=sr*dur|0,buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0);
  for(let i=0;i<n;i++){const x=i/n;d[i]=(Math.random()*2-1)*Math.min(1,x*6)*Math.pow(1-x,1.2)}
  const s=a.createBufferSource();s.buffer=buf;const f1=a.createBiquadFilter(),f2=a.createBiquadFilter();f1.type=f2.type='bandpass';f1.Q.value=f2.Q.value=1.6;
  const t=a.currentTime;f1.frequency.setValueAtTime(480,t);f1.frequency.linearRampToValueAtTime(760,t+dur*.5);f2.frequency.setValueAtTime(1150,t);f2.frequency.linearRampToValueAtTime(1500,t+dur*.5);
  const g=a.createGain();g.gain.value=vol*1.6;s.connect(f1);f1.connect(f2);f2.connect(g);send(g,.3);s.start();
}
// rullende bold i græs: brunt støj-bånd hvis styrke og tone følger hastigheden
function updateRoll(){
  if(!AC)return;
  if(!rollG){const sr=AC.sampleRate,buf=AC.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);let b=0;for(let i=0;i<d.length;i++){b=(b+.03*(Math.random()*2-1))/1.03;d[i]=b*4}

function spawn(x,y,n,col,sp,up,sz){for(let i=0;i<n;i++){const a=Math.random()*7,v=Math.random()*sp;parts.push({x,y,z:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:up*(.4+Math.random()*.6),l:.5+Math.random()*.4,col,s:sz||1.2})}}
function drawParts(dt){
  for(const p of parts){p.vz-=500*dt;p.z+=p.vz*dt;if(p.z<0)p.z=0;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;cx.globalAlpha=Math.max(0,Math.min(1,p.l*2.5));cx.fillStyle=p.col;cx.fillRect(p.x-p.s,p.y-p.z*ZV-p.s,p.s*2,p.s*2)}
  cx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
}
function computePreview(){
  if(!drag||!drag.locked||drag.t<.05){prev=null;return}
  const k=kickParams(drag.t,drag.spin,drag.ang),b={x:ball.x,y:ball.y,z:0,vx:k.vx,vy:k.vy,vz:k.vz,spin:k.spin};
  const pts=[];let landed=null,after=0;const dt=1/120,lofted=k.vz>0;
  for(let i=0;i<360;i++){step(b,dt,null);if(i%4===3)pts.push([b.x,b.y,b.z]);
    if(lofted&&!landed&&b.z===0)landed=[b.x,b.y];
    if(b.done)break;
    if(landed||!lofted){after+=dt;if(after>(lofted?.4:1.15))break}}
  prev={pts,landed,sunk:b.done==='sunk'};
}
function drawAim(){
  if(!drag)return;
  // gummibånd
  const px=drag.cx-drag.sx,py=drag.cy-drag.sy,pl=Math.min(Math.hypot(px,py),drag.max*1.3)/scale;
  if(pl>2){const a=Math.atan2(py,px);cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2;cx.setLineDash([3,4]);cx.beginPath();cx.moveTo(ball.x,ball.y);cx.lineTo(ball.x+Math.cos(a)*pl,ball.y+Math.sin(a)*pl);cx.stroke();cx.setLineDash([]);
    cx.beginPath();cx.arc(ball.x+Math.cos(a)*pl,ball.y+Math.sin(a)*pl,4,0,7);cx.fillStyle='rgba(255,255,255,.7)';cx.fill()}
  if(!prev)return;const n=prev.pts.length;
  for(let i=0;i<n;i++){const p=prev.pts[i];if(p[2]>0){cx.fillStyle='rgba(0,30,0,.3)';cx.beginPath();cx.arc(p[0]+p[2]*.38,p[1]+p[2]*.22,2,0,7);cx.fill()}}
  for(let i=0;i<n;i++){const p=prev.pts[i],f=1-i/n*.6;cx.fillStyle=p[2]>0?'rgba(255,240,120,'+f+')':'rgba(255,255,255,'+f+')';cx.beginPath();cx.arc(p[0],p[1]-p[2]*ZV,p[2]>0?2.6+p[2]/60:2.4,0,7);cx.fill()}
  if(prev.landed){const l=prev.landed;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.ellipse(l[0],l[1],11,7.5,0,0,7);cx.stroke();cx.strokeStyle='rgba(0,0,0,.4)';cx.lineWidth=1;cx.beginPath();cx.ellipse(l[0],l[1],13,9,0,0,7);cx.stroke();
    cx.beginPath();cx.moveTo(l[0]-5,l[1]);cx.lineTo(l[0]+5,l[1]);cx.moveTo(l[0],l[1]-3.5);cx.lineTo(l[0],l[1]+3.5);cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.stroke()}
}
function drawMeter(){
  if(!drag)return;const x=16,h=Math.min(210,ch*.3),y=ch*.5-h/2,w=16,t=drag.locked?drag.t:0;
  cx.fillStyle='rgba(0,0,0,.55)';cx.beginPath();cx.roundRect(x-5,y-22,w+58,h+62,10);cx.fill();
  cx.fillStyle='rgba(255,255,255,.18)';cx.beginPath();cx.roundRect(x,y,w,h,5);cx.fill();
  const g=cx.createLinearGradient(0,y+h,0,y);g.addColorStop(0,'#7be06a');g.addColorStop(LOFT_T,'#d7e85a');g.addColorStop(LOFT_T+.01,'#ffcf4a');g.addColorStop(1,'#ff5a3c');
  cx.fillStyle=g;cx.beginPath();cx.roundRect(x,y+h*(1-t),w,h*t,5);cx.fill();
  const ly=y+h*(1-LOFT_T);cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(x-3,ly);cx.lineTo(x+w+3,ly);cx.stroke();
  cx.fillStyle='#fff';cx.font='bold 10px sans-serif';cx.textAlign='left';
  cx.globalAlpha=t>LOFT_T?1:.5;cx.fillText('LUFT',x+w+7,ly-8);cx.globalAlpha=t>LOFT_T?.5:1;cx.fillText('JORD',x+w+7,ly+16);cx.globalAlpha=1;
  cx.font='bold 11px sans-serif';cx.fillText(Math.round(t*100)+'%',x,y-8);
  // skru
  const sy=y+h+20,sw=62,sx=x;cx.fillStyle='rgba(255,255,255,.18)';cx.beginPath();cx.roundRect(sx,sy,sw,7,3);cx.fill();
  const s=drag.locked?drag.spin:0;cx.fillStyle='#6fd0ff';if(s>0)cx.fillRect(sx+sw/2,sy,sw/2*s,7);else cx.fillRect(sx+sw/2+sw/2*s,sy,-sw/2*s,7);
  cx.fillStyle='#fff';cx.fillRect(sx+sw/2-1,sy-2,2,11);cx.font='bold 10px sans-serif';cx.fillText(Math.abs(s)<.01?'SKRU':(s>0?'SKRU →':'← SKRU'),sx,sy+21);
}

// ---------- input ----------
function pt(e){return{x:e.clientX,y:e.clientY}}
cv.addEventListener('pointerdown',e=>{
  ac();if(state!=='aim'||overview)return;const p=pt(e);
  drag={id:e.pointerId,sx:p.x,sy:p.y,cx:p.x,cy:p.y,locked:false,ang:0,t:0,spin:0,max:Math.min(ch*.15,115)};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}$('hint').style.opacity=0;
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;const p=pt(e);drag.cx=p.x;drag.cy=p.y;
  const px=drag.sx-p.x,py=drag.sy-p.y,len=Math.hypot(px,py);
  if(len<12){drag.locked=false;drag.t=0;drag.spin=0}   // fingeren tilbage ved start = annuller
  else if(!drag.locked&&len>22){drag.locked=true;drag.lockAng=Math.atan2(py,px)}
  if(drag.locked){
    // retning = præcis hvor fingeren trækker; skru = hvor meget trækket er bukket væk fra den første retning
    drag.ang=Math.atan2(py,px);
    let dl=drag.ang-drag.lockAng;while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;
    drag.t=Math.max(0,Math.min(1,(len-8)/drag.max));
    const s=Math.max(-1,Math.min(1,dl/.6));drag.spin=Math.abs(s)<.05?0:(s-Math.sign(s)*.05)/.95;
  }
  computePreview();
});
function release(e){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;prev=null;
  if(!d.locked||d.t<.05||state!=='aim')return;
  const k=kickParams(d.t,d.spin,d.ang);last={x:ball.x,y:ball.y};
  ball.vx=k.vx;ball.vy=k.vy;ball.vz=k.vz;ball.spin=k.spin;ball.done=null;ball.leaf=0;strokes++;state='fly';hud();
  SND.kick(d.t);spawn(ball.x,ball.y,6+d.t*10|0,'#8fd060',60,90*d.t+30);
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;prev=null}});
$('bRe').onclick=()=>{reset()};
$('bMap').onclick=()=>{overview=!overview;$('bMap').textContent=overview?'Tilbage':'Kort'};
$('bSnd').onclick=()=>{sndOn=!sndOn;$('bSnd').textContent=sndOn?'🔊':'🔇'};
$('eB').onclick=()=>reset();

// ---------- effekter ----------
const cloudSp=document.createElement('canvas');cloudSp.width=560;cloudSp.height=340;
(function(){const c=cloudSp.getContext('2d'),r=rnd(5);for(let i=0;i<14;i++){const x=120+r()*320,y=90+r()*160,R=60+r()*70;const g=c.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,'rgba(0,25,20,.11)');g.addColorStop(1,'rgba(0,25,20,0)');c.fillStyle=g;c.fillRect(x-R,y-R,R*2,R*2)}})();
function drawClouds(){for(let i=0;i<3;i++){const k=1+i*.2,x=((tNow*(7+i*3)+i*340)%(W+900))-560,y=i*620+250+Math.sin(tNow*.05+i)*60;cx.drawImage(cloudSp,x,y,560*k,340*k)}}
function drawButterflies(){for(let i=0;i<3;i++){const t=tNow*.5+i*20,bx=[130,480,120][i]+Math.sin(t*1.3)*60+Math.sin(t*.7+i)*30,by=[1400,980,420][i]+Math.cos(t*1.1)*50;
  const f=Math.abs(Math.sin(tNow*14+i*2)),y=by-10-Math.sin(t*2)*4,col=['#ffd23f','#ff7ab6','#7ad7ff'][i];
  cx.fillStyle='rgba(0,25,0,.2)';cx.beginPath();cx.ellipse(bx+3,by+4,4,2,0,0,7);cx.fill();
  cx.fillStyle=col;for(const sg of[-1,1]){cx.beginPath();cx.ellipse(bx+sg*3.5*f,y-1,3.6*f+.6,4.2,sg*.4,0,7);cx.fill()}
  cx.fillStyle='#222';cx.fillRect(bx-.7,y-3,1.4,6)}}
function drawTrail(dt){
  for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];cx.strokeStyle='rgba(255,255,255,'+(b.l*.35)+')';cx.lineWidth=BR*1.5*b.l;cx.lineCap='round';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
  for(const p of trail)p.l-=dt*3.2;trail=trail.filter(p=>p.l>0);
}
function drawHoleFx(dt){
  if(fx.t<0)return;fx.t+=dt;const t=fx.t;
  const ga=Math.max(0,1-t/1.3)*.6;if(ga>0){const g=cx.createRadialGradient(HOLE.x,HOLE.y,2,HOLE.x,HOLE.y,80);g.addColorStop(0,'rgba(255,235,140,'+ga+')');g.addColorStop(1,'rgba(255,235,140,0)');cx.fillStyle=g;cx.fillRect(HOLE.x-80,HOLE.y-80,160,160)}
  for(let i=0;i<3;i++){const tt=t-i*.2;if(tt>0&&tt<1){const r=10+tt*95,a=1-tt;cx.strokeStyle='rgba(255,255,255,'+a*.75+')';cx.lineWidth=1+3*a;cx.beginPath();cx.arc(HOLE.x,HOLE.y,r,0,7);cx.stroke()}}
  if(t>5)fx.t=-1;
}
function startSink(){
  state='sink';sink={t:0,x0:ball.x,y0:ball.y};fx.t=0;flagShake=1;
  spawn(HOLE.x,HOLE.y,34,'#ffe27a',150,280,1.8);spawn(HOLE.x,HOLE.y,20,'#8fd060',110,200,1.4);spawn(HOLE.x,HOLE.y,16,'#ffffff',90,240,1.4);
}
function drawSinkBall(){
  const k=Math.min(1,sink.t/.45),x=ball.x,y=ball.y+k*k*8,r=BR*(1-.42*k);
  cx.save();if(k>.25){cx.beginPath();cx.arc(HOLE.x,HOLE.y,HOLE.r-1,0,7);cx.clip()}
  const g=cx.createRadialGradient(x-r*.4,y-r*.45,r*.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.7,'#e9e9e4');g.addColorStop(1,'#9d9d98');
  cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=g;cx.fill();cx.fillStyle='rgba(0,0,0,'+(.15+.7*k)+')';cx.fill();cx.restore();
}
const CONF=['#ff4d4d','#ffd23f','#4dd2ff','#7ed957','#ff7ab6','#ffffff','#b980ff'];
function burstConfetti(n){
  for(let i=0;i<n;i++){const side=i%3,c={col:CONF[i%CONF.length],w:5+Math.random()*5,h:3+Math.random()*4,rot:Math.random()*7,vr:(Math.random()-.5)*14,ph:Math.random()*7};
    if(side===0){c.x=Math.random()*cw;c.y=-20-Math.random()*ch*.4;c.vx=(Math.random()-.5)*80;c.vy=90+Math.random()*140}
    else{const L=side===1;c.x=L?-10:cw+10;c.y=ch*(.55+Math.random()*.3);c.vx=(L?1:-1)*(160+Math.random()*420);c.vy=-(500+Math.random()*700)}
    confetti.push(c)}
}
function drawConfetti(dt){
  for(const c of confetti){c.vy+=620*dt;c.vx*=Math.pow(.35,dt);if(c.vy>230)c.vy=230+(c.vy-230)*.9;c.x+=c.vx*dt+Math.sin(tNow*3+c.ph)*20*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;
    cx.save();cx.translate(c.x,c.y);cx.rotate(c.rot);cx.scale(1,Math.abs(Math.sin(tNow*6+c.ph))*.8+.2);cx.fillStyle=c.col;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cx.restore()}
  confetti=confetti.filter(c=>c.y<ch+30);
}
function drawBanner(dt){
  if(!banner)return;banner.age+=dt;const a=banner.age;if(a>3.4)return;
  const t=Math.min(1,a/.45),sc=t>=1?1:1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2),al=a>2.8?1-(a-2.8)/.6:1;
  const cxn=cw/2,cyn=ch*.3,good=banner.hio||banner.d<=-1;
  cx.save();cx.globalAlpha=al;
  if(good){const R=Math.max(cw,ch)*.6,g=cx.createRadialGradient(cxn,cyn,0,cxn,cyn,R);g.addColorStop(0,'rgba(255,225,110,.24)');g.addColorStop(1,'rgba(255,225,110,0)');cx.fillStyle=g;
    cx.save();cx.translate(cxn,cyn);cx.rotate(a*.4);for(let i=0;i<16;i++){cx.rotate(Math.PI*2/16);cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R,-.07,.07);cx.fill()}cx.restore()}
  cx.translate(cxn,cyn);cx.scale(sc,sc);cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';
  const fs=Math.min(58,cw*.13)|0;cx.font='800 '+fs+'px -apple-system,Helvetica,Arial,sans-serif';
  const cols=banner.hio?['#fff3b0','#ffc233']:banner.d<=-1?['#e6ffb0','#7ed957']:banner.d===0?['#ffffff','#d8e8ff']:['#e0e6ee','#9fb0c4'];
  const g2=cx.createLinearGradient(0,-fs/2,0,fs/2);g2.addColorStop(0,cols[0]);g2.addColorStop(1,cols[1]);
  cx.strokeStyle='rgba(15,40,10,.88)';cx.lineWidth=fs*.2;cx.strokeText(banner.txt,0,0);cx.fillStyle=g2;cx.fillText(banner.txt,0,0);
  cx.font='700 '+Math.max(15,fs*.34|0)+'px -apple-system,Helvetica,Arial,sans-serif';cx.lineWidth=5;cx.strokeText(banner.sub,0,fs*.78);cx.fillStyle='#fff';cx.fillText(banner.sub,0,fs*.78);
  cx.restore();
}
function drawLight(){
  const m=Math.max(cw,ch);let g=cx.createRadialGradient(cw/2,ch*.5,m*.3,cw/2,ch*.5,m*.85);g.addColorStop(0,'rgba(0,20,0,0)');g.addColorStop(1,'rgba(0,15,10,.42)');cx.fillStyle=g;cx.fillRect(0,0,cw,ch);
  g=cx.createLinearGradient(0,0,cw,ch);g.addColorStop(0,'rgba(255,236,170,.12)');g.addColorStop(.5,'rgba(255,236,170,0)');g.addColorStop(1,'rgba(10,20,60,.10)');cx.fillStyle=g;cx.fillRect(0,0,cw,ch);
}

// ---------- spil-løkke ----------
const NAMES={'-3':'Albatros!','-2':'Eagle!','-1':'Birdie!','0':'Par','1':'Bogey','2':'Dobbelt bogey'};
function finish(){
  state='sunk';const d=strokes-4,hio=strokes===1;
  const nm=hio?'Hole in one!':(NAMES[d]||'+'+d);
  $('eT').textContent=nm;
  if(!best||strokes<best){best=strokes;try{localStorage.setItem('fodboldgolf_best',JSON.stringify(best))}catch(e){}}
  $('eP').textContent=strokes+' slag på par 4 · bedste: '+best;
  banner={age:0,txt:nm.toUpperCase().replace('!','')+(hio||d<=-1?'!':''),sub:strokes+' slag · par 4',d,hio};
  burstConfetti(hio?240:d<=-1?170:d===0?90:d===1?30:0);SND.result(d,hio);
  setTimeout(()=>{if(state==='sunk')$('end').style.display='flex'},hio?3300:2700);hud();
}
function handle(ev){
  for(const e of ev){
    if(SND[e])SND[e](Math.min(1,(Math.abs(ball.vz)+Math.hypot(ball.vx,ball.vy)*.6)/520));
    if(e==='bounce'||e==='land'){spawn(ball.x,ball.y,5,'#8fd060',50,60);sq=e==='bounce'?1:.6}
    if(e==='sand')spawn(ball.x,ball.y,16,'#e6d395',70,120);
    if(e==='leaf')spawn(ball.x,ball.y-ball.z*ZV+20,14,'#4fae3f',60,40);
    if(e==='water'){spawn(ball.x,ball.y,26,'#cfeaff',80,190);state='wet';wetT=1;toast('I vandet! +1 slag')}
    if(e==='sunk')startSink();
  }
}
let acc=0,lastT=0;
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;tNow=ts/1000;
  updateRoll();sq=Math.max(0,sq-dt*7);flagShake=Math.max(0,flagShake-dt*1.1);
  if(state==='fly'&&Math.hypot(ball.vx,ball.vy)>140){trail.push({x:ball.x,y:ball.y-ball.z*ZV,l:1});if(trail.length>40)trail.shift()}
  if(state==='fly'){acc+=dt;const ev=[];
    while(acc>=1/120&&state==='fly'){acc-=1/120;const ox=ball.x,oy=ball.y;step(ball,1/120,ev);rotBall(ball.x-ox,ball.y-oy,ball.spin*.12);
      if(ball.done){if(ball.done==='stop'){settle(ball);state='aim';hud()}break}}
    handle(ev);
  }else if(state==='sink'){sink.t+=dt;const k=Math.min(1,sink.t/.4),e=1-(1-k)*(1-k);ball.x=sink.x0+(HOLE.x-sink.x0)*e;ball.y=sink.y0+(HOLE.y-sink.y0)*e;ball.z=0;if(sink.t>.55)finish();
  }else if(state==='wet'){wetT-=dt;if(wetT<=0){ball={x:last.x,y:last.y,z:0,vx:0,vy:0,vz:0,spin:0};strokes++;state='aim';hud()}}
  // kamera
  if(!drag){const ty=targetCamY();camY+=(ty-camY)*Math.min(1,dt*(state==='fly'?5:3.5))}
  let s=scale,ox=camX,oy=camY;
  if(overview){s=Math.min(cw/W,ch/H);ox=(W-cw/s)/2;oy=(H-ch/s)/2}
  const zt=(state==='sink'||state==='sunk')&&!overview?1:0;zoomK+=(zt-zoomK)*Math.min(1,dt*2.6);
  if(zoomK>.002&&!overview){const ccx=ox+cw/s/2,ccy=oy+ch/s/2,tx=ccx+(HOLE.x+10-ccx)*zoomK,ty=ccy+(HOLE.y-14-ccy)*zoomK;s*=1+.55*zoomK;ox=tx-cw/s/2;oy=ty-ch/s/2}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#2c5f20';cx.fillRect(0,0,cw,ch);
  cx.setTransform(dpr*s,0,0,dpr*s,-ox*dpr*s,-oy*dpr*s);
  cx.drawImage(st,0,0,W,H);drawWater();drawClouds();drawHoleFx(dt);drawTrail(dt);
  const items=[];for(const sg of SEGS)if(sg.type==='log')items.push([sg.y1,()=>drawLog(sg)]);
  items.push([300,drawHedge]);for(const t of TREES)items.push([t.y,()=>drawTree(t)]);items.push([HOLE.y+.5,drawFlag]);
  const high=ball.z>60;const hid=state==='sink'||state==='sunk';if(state!=='wet'){if(!hid)drawBallShadow();if(!high)items.push([ball.y,drawBall])}
  items.sort((a,b)=>a[0]-b[0]);for(const it of items)it[1]();
  if(high&&state!=='wet')drawBall();
  drawButterflies();drawParts(dt);if(state==='aim')drawAim();
  cx.setTransform(dpr,0,0,dpr,0,0);drawLight();drawConfetti(dt);drawBanner(dt);if(state==='aim')drawMeter();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize();camY=targetCamY()});
resize();buildStatic();reset();requestAnimationFrame(frame);
</script>
